services:
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_DB: maiadb
      POSTGRES_USER: maia
      POSTGRES_PASSWORD: maia
    ports:
      - '5432:5432'
    volumes:
      - postgres_data_v18:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U maia -d maiadb']
      interval: 10s
      timeout: 5s
      retries: 5

  migrate:
    build:
      context: ./backend
    command: npm run db:migrate
    environment:
      DATABASE_URL: postgresql://maia:maia@postgres:5432/maiadb
    volumes:
      - ./backend:/app
      - /app/node_modules
    depends_on:
      postgres:
        condition: service_healthy

  backend:
    build:
      context: ./backend
    environment:
      NODE_ENV: development
      HOST: 0.0.0.0
      PORT: 3000
      DATABASE_URL: postgresql://maia:maia@postgres:5432/maiadb
      JWT_SECRET: local-development-secret
      CORS_ORIGIN: '*'
    ports:
      - '3000:3000'
    volumes:
      - ./backend:/app
      - /app/node_modules
    depends_on:
      migrate:
        condition: service_completed_successfully

  frontend:
    build:
      context: ./frontend
    environment:
      EXPO_NO_TELEMETRY: '1'
      EXPO_PUBLIC_API_URL: http://localhost:3000
      CHOKIDAR_USEPOLLING: 'true'
    expose:
      - '8081'
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend

  gateway:
    image: nginx:1.30.4-alpine
    ports:
      - '8082:80'
    volumes:
      - ./infra/nginx/maia-preview.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend

volumes:
  postgres_data_v18:
