services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: maiadb
      POSTGRES_USER: maia
      POSTGRES_PASSWORD: maia
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U maia -d maiadb']
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    environment:
      NODE_ENV: development
      HOST: 0.0.0.0
      PORT: 3000
      DATABASE_URL: postgresql://maia:maia@postgres:5432/maiadb
      JWT_SECRET: local-development-secret
      CORS_ORIGIN: '*'
    ports:
      - '3000:3000'
    volumes:
      - ./backend:/app
      - /app/node_modules
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    environment:
      EXPO_NO_TELEMETRY: '1'
      EXPO_PUBLIC_API_URL: http://localhost:3000
      CHOKIDAR_USEPOLLING: 'true'
    ports:
      - '8081:8081'
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend

volumes:
  postgres_data:
