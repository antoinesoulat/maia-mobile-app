name: CI

on:
  workflow_dispatch:
  pull_request:
    branches:
      - develop
      - main
  push:
    branches:
      - develop
      - main

jobs:
  linting:
    name: Quality checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install root dependencies
        run: npm ci

      - name: Install backend dependencies
        run: npm ci
        working-directory: backend

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Check Expo project
        run: npm exec -- expo-doctor
        working-directory: frontend

      - name: Check Drizzle schema
        run: npm run db:generate
        working-directory: backend

      - name: Audit root production dependencies
        run: npm audit --omit=dev --audit-level=critical

      - name: Audit backend production dependencies
        run: npm audit --omit=dev --audit-level=critical
        working-directory: backend

      - name: Audit frontend production dependencies
        run: npm audit --omit=dev --audit-level=critical
        working-directory: frontend

  tests:
    name: Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_DB: maiadb
          POSTGRES_PASSWORD: maia
          POSTGRES_USER: maia
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U maia -d maiadb"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://maia:maia@localhost:5432/maiadb
      JWT_SECRET: ci-integration-secret
      NODE_ENV: test

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install backend dependencies
        run: npm ci
        working-directory: backend

      - name: Apply database migrations
        run: npm run db:migrate
        working-directory: backend

      - name: Run backend tests
        run: npm test -- --passWithNoTests
        working-directory: backend

      - name: Run authentication integration test
        run: npm run test:integration
        working-directory: backend

  build:
    name: Build Docker services
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Build Docker services
        run: docker compose build
